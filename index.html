<title>Gudang Part — Workshop</title>

<style>
  :root{
    --bg:#E3E6E8;
    --surface:#FFFFFF;
    --ink:#161A20;
    --ink-soft:#586170;
    --steel:#232C3D;
    --steel-2:#3D4A63;
    --amber:#E8A33D;
    --amber-ink:#5C3D0A;
    --red:#B3261E;
    --green:#3F7D58;
    --line:#D3D7D2;
    --line-soft:#E7E9E4;

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-variant-numeric:tabular-nums;}
  h1,h2,h3{font-family:'Archivo',system-ui,sans-serif;margin:0;}
  #app{max-width:960px;margin:0 auto;padding-bottom:64px;}

  .topbar{
    background:var(--steel);
    color:#fff;
    padding:20px 20px 16px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:16px;
    flex-wrap:wrap;
    position:sticky;
    top:0;
    z-index:20;
  }
  .brand{display:flex;gap:14px;align-items:center;}
  .brand-mark{
    font-family:'Archivo',sans-serif;
    font-weight:900;
    font-size:12px;
    letter-spacing:0.5px;
    background:var(--amber);
    color:var(--amber-ink);
    padding:8px 9px;
    border-radius:4px;
    line-height:1;
  }
  .brand h1{font-size:21px;font-weight:800;}
  .brand p{margin:3px 0 0;font-size:13px;color:#B7BECC;}
  .topbar-actions{display:flex;gap:6px;align-items:center;}
  .tab-btn{
    background:transparent;
    border:1px solid #4A566C;
    color:#C7CDD9;
    padding:8px 14px;
    border-radius:4px;
    font-family:'IBM Plex Sans',sans-serif;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
  }
  .tab-btn.active{background:#fff;color:var(--steel);border-color:#fff;}
  .sync-btn{
    background:transparent;border:none;color:#8E97A8;cursor:pointer;font-size:12px;
    padding:6px 8px;display:flex;align-items:center;gap:5px;
  }
  .sync-btn:hover{color:#fff;}

  .controls{
    padding:16px 20px 8px;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    align-items:center;
  }
  #searchInput{
    flex:1;
    min-width:180px;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:4px;
    font-family:'IBM Plex Sans',sans-serif;
    font-size:14px;
    background:var(--surface);
    color:var(--ink);
  }
  #searchInput:focus{outline:2px solid var(--steel-2);outline-offset:1px;}
  .result-count{font-size:12.5px;color:var(--ink-soft);padding:0 20px 4px;}
  .rak-filters{display:flex;gap:6px;flex-wrap:wrap;padding:0 20px 8px;}
  .rak-chip{
    border:1px solid var(--line);
    background:var(--surface);
    padding:7px 11px;
    border-radius:4px;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .rak-chip.active{background:var(--steel);color:#fff;border-color:var(--steel);}

  main{padding:6px 20px 0;}

  .part-row{
    background:var(--surface);
    border:1px solid var(--line-soft);
    border-left:5px solid #999;
    border-radius:3px;
    padding:14px 16px;
    margin-bottom:8px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
  }

  .part-main{flex:1;min-width:220px;}
  .part-tag{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    color:var(--ink-soft);
    background:var(--line-soft);
    padding:2px 7px;
    border-radius:3px;
    margin-right:8px;
    letter-spacing:0.3px;

  .part-name{font-weight:600;font-size:15px;}
  .part-meta{font-size:12.5px;color:var(--ink-soft);margin-top:5px;}
  .part-meta b{color:var(--ink);}

  .part-stock{text-align:right;min-width:110px;}
  .stock-num{font-size:22px;font-weight:700;font-family:'Archivo',sans-serif;}
  .stock-unit{font-size:12px;color:var(--ink-soft);}
  .stock-num.low{color:var(--red);}
  .stock-num.ok{color:var(--ink);}

  .part-actions{display:flex;gap:6px;}
  .btn{
    border:none;
    padding:9px 14px;
    border-radius:4px;
    font-family:'IBM Plex Sans',sans-serif;
    font-weight:600;
    font-size:13px;
    cursor:pointer;

  .btn-primary{background:var(--amber);color:var(--amber-ink);}

  .btn-ghost{background:transparent;color:var(--steel-2);border:1px solid var(--line);}

  .empty-state{

    background:var(--surface);

    padding:12px 16px;

  .tx-icon.masuk{background:var(--green);}

  .tx-title{font-size:14px;font-weight:600;}
  .tx-sub{font-size:12.5px;color:var(--ink-soft);margin-top:3px;}
  .tx-time{font-size:12px;color:var(--ink-soft);white-space:nowrap;}

  .field{margin-bottom:14px;}

  .field input,.field textarea,.field select{

  .toggle-btn{

  .btn-cancel{background:var(--line-soft);color:var(--ink-soft);}

  }

  </div>
</div>

    <p class="field-error" id="addPartError"></p>

</div>

// Ganti dengan URL Realtime Database dari Firebase Console kamu.
// Contoh: 'https://gudang-part-workshop-default-rtdb.asia-southeast1.firebasedatabase.app'
const FIREBASE_DB_URL = 'https://console.firebase.google.com/u/0/project/list-sparepart-mtc/database?fb_gclid=CjwKCAjw2aPVBhBkEiwA0Cpttxmbb9dfo7XAyiEpd2dcM2aZ1cPAqYpH5S9WYR6cWx2FS_kJwXSoxRoCjnIQAvD_BwE&fb_utm_campaign=Cloud-SS-DR-Firebase-FY26-global-gsem-1713590&fb_utm_content=text-ad&fb_utm_medium=cpc&fb_utm_source=google&fb_utm_term=KW_console%20firebase%20google%20com';
// Database Secret dari Project Settings > Service accounts > Database secrets.
// Rules di Firebase di-set ".read": false / ".write": false, jadi cuma request
// yang nyelipin secret ini (lewat ?auth=) yang bisa tembus.
const FIREBASE_DB_SECRET = 'ISI_DATABASE_SECRET_DI_SINI';

// Polyfill window.storage supaya app ini (yang aslinya dibuat pakai
// storage khusus Claude artifact) bisa nyimpen data ke Firebase saat
// di-host di luar Claude (GitHub Pages, dll).
window.storage = {
  async get(key, shared){
    const res = await fetch(`${FIREBASE_DB_URL}/${encodeURIComponent(key)}.json?auth=${FIREBASE_DB_SECRET}`);
    if(!res.ok) throw new Error('Gagal ambil data dari database');
    const data = await res.json();
    if(data === null || data === undefined || data.value === undefined){
      throw new Error('Data belum ada di database');
    }
    return { key, value: data.value, shared: !!shared };
  },
  async set(key, value, shared){
    const res = await fetch(`${FIREBASE_DB_URL}/${encodeURIComponent(key)}.json?auth=${FIREBASE_DB_SECRET}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ value, updatedAt: new Date().toISOString() })
    });
    if(!res.ok) throw new Error('Gagal simpan data ke database');
    return { key, value, shared: !!shared };
  }
};

const RAK_GROUP_COLORS = {
  A:'#3465A4', B:'#3F7D58', C:'#C08A2E', D:'#7A4C8F', E:'#B3261E',
  F:'#2B7A78', G:'#8C5B3F', H:'#4A6FA5', I:'#6B8E23', LANTAI:'#9C4F96'
};
function rakGroupKey(rak){
  return rak.trim().toLowerCase() === 'di lantai' ? 'LANTAI' : rak.trim().charAt(0).toUpperCase();
}
function rakColor(rak){
  return RAK_GROUP_COLORS[rakGroupKey(rak)] || '#586170';
}

function keyOf(rak, part){
  return (rak.trim() + '|' + part.trim()).toLowerCase();
}

function mergeMissingParts(st){
  if(!st.parts) st.parts = [];
  if(!st.transactions) st.transactions = [];
  const existingKeys = new Set(st.parts.map(p => keyOf(p.rak, p.part)));
  let maxNum = 0;
  st.parts.forEach(p=>{
    const m = /^p(\d+)$/.exec(p.id);
    if(m) maxNum = Math.max(maxNum, parseInt(m[1], 10));
  });
  let added = false;
  INITIAL_PARTS.forEach(seed=>{
    const k = keyOf(seed.rak, seed.part);
    if(!existingKeys.has(k)){
      maxNum++;
      st.parts.push({
        id: 'p'+maxNum,
        rak: seed.rak,
        part: seed.part,
        qtyAwal: seed.qtyAwal,
        satuan: seed.satuan,
        qtyDiambil: seed.qtyDiambilSeed || 0,
        tanggalMasuk: seed.tanggalMasukSeed || null,
        tanggalKeluar: seed.tanggalKeluarSeed || null,
        pic: seed.picSeed || null
      });
      existingKeys.add(k);
      added = true;
    }
  });
  return added;
}

let state = null;
let currentView = 'stock';
let currentRakFilter = 'ALL';
let searchTerm = '';
let modalPartId = null;
let modalType = 'keluar';
let isSaving = false;

const el = (id) => document.getElementById(id);

function showToast(msg){
  const t = el('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(()=> t.classList.remove('show'), 2600);
}

async function loadState(){
  let fetched = null;
  try{
    const res = await window.storage.get(STORAGE_KEY, true);
    if(res && res.value) fetched = JSON.parse(res.value);
  }catch(e){
    fetched = null;
  }
  state = fetched || { parts: [], transactions: [] };
  const added = mergeMissingParts(state);
  if(added || !fetched){
    try{ await saveState(); }
    catch(e){ console.error('Gagal menyimpan data awal', e); }
  }
}

async function saveState(){
  await window.storage.set(STORAGE_KEY, JSON.stringify(state), true);
}

function fmtDateTime(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleString('id-ID', {day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'}) + ' WIB';
}

function sisaStok(p){
  return p.qtyAwal - p.qtyDiambil;
}

function uniqueRaks(){
  const set = new Set(state.parts.map(p=>p.rak.trim()));
  return Array.from(set).sort((a,b)=> a.localeCompare(b, undefined, {numeric:true, sensitivity:'base'}));
}

function renderRakFilters(){
  const raks = ['ALL', ...uniqueRaks()];
  const wrap = el('rakFilters');
  wrap.innerHTML = '';
  raks.forEach(r=>{
    const btn = document.createElement('button');
    btn.className = 'rak-chip' + (currentRakFilter===r ? ' active' : '');
    btn.textContent = r==='ALL' ? 'Semua rak' : r;
    btn.onclick = ()=>{ currentRakFilter = r; renderRakFilters(); renderStockList(); };
    wrap.appendChild(btn);
  });
}

function renderStockList(){
  const wrap = el('partList');
  let parts = state.parts.filter(p=>{
    const matchRak = currentRakFilter==='ALL' || p.rak===currentRakFilter;
    const matchSearch = p.part.toLowerCase().includes(searchTerm.toLowerCase());
    return matchRak && matchSearch;
  });

  el('resultCount').textContent = parts.length + ' dari ' + state.parts.length + ' part';

  if(parts.length===0){
    wrap.innerHTML = '<div class="empty-state">Tidak ada part yang cocok.</div>';
    return;
  }

  wrap.innerHTML = '';
  parts.forEach(p=>{
    const sisa = sisaStok(p);
    const row = document.createElement('div');
    row.className = 'part-row';
    row.style.borderLeftColor = rakColor(p.rak);

    const metaBits = [];
    if(p.tanggalKeluar) metaBits.push('Terakhir diambil <b>'+fmtDateTime(p.tanggalKeluar)+'</b> oleh <b>'+escapeHtml(p.pic||'-')+'</b>');
    else if(p.tanggalMasuk) metaBits.push('Masuk <b>'+fmtDateTime(p.tanggalMasuk)+'</b> oleh <b>'+escapeHtml(p.pic||'-')+'</b>');
    else metaBits.push('Belum ada aktivitas');

    row.innerHTML = `
      <div class="part-main">
        <span class="part-tag">${escapeHtml(p.rak)}</span><span class="part-name">${escapeHtml(p.part)}</span>
        <div class="part-meta">${metaBits.join(' · ')}</div>
      </div>
      <div class="part-stock">
        <div class="stock-num ${sisa<=1 ? 'low':'ok'}">${sisa}</div>
        <div class="stock-unit">${escapeHtml(p.satuan)} tersisa</div>
      </div>
      <div class="part-actions">
        <button class="btn btn-ghost" data-action="masuk" data-id="${p.id}">+ Stok</button>
        <button class="btn btn-primary" data-action="keluar" data-id="${p.id}" ${sisa<=0?'disabled':''}>Ambil</button>
      </div>
    `;
    wrap.appendChild(row);
  });

  wrap.querySelectorAll('button[data-action]').forEach(btn=>{
    btn.addEventListener('click', ()=> openModal(btn.dataset.id, btn.dataset.action));
  });
}

function renderHistoryList(){
  const wrap = el('historyList');
  const txs = [...state.transactions].sort((a,b)=> new Date(b.ts) - new Date(a.ts));
  if(txs.length===0){
    wrap.innerHTML = '<div class="empty-state">Belum ada aktivitas tercatat.</div>';
    return;
  }
  wrap.innerHTML = '';
  txs.forEach(tx=>{
    const row = document.createElement('div');
    row.className = 'tx-row';
    const txIcon = tx.type==='keluar' ? '↓' : (tx.type==='baru' ? '+' : '↑');
    const txLabel = tx.type==='keluar' ? 'Ambil' : (tx.type==='baru' ? 'Part baru' : 'Tambah stok');
    row.innerHTML = `
      <div class="tx-icon ${tx.type}">${txIcon}</div>
      <div class="tx-body">
        <div class="tx-title">${txLabel} ${tx.qty} ${escapeHtml(tx.satuan)} — ${escapeHtml(tx.partName)} <span class="part-tag">${escapeHtml(tx.rak)}</span></div>
        <div class="tx-sub">${escapeHtml(tx.email)}${tx.note ? ' · '+escapeHtml(tx.note) : ''}</div>
      </div>
      <div class="tx-time">${fmtDateTime(tx.ts)}</div>
    `;
    wrap.appendChild(row);
  });
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str==null ? '' : String(str);
  return d.innerHTML;
}

function openModal(partId, type){
  modalPartId = partId;
  modalType = type;
  const p = state.parts.find(x=>x.id===partId);
  el('modalPartName').textContent = p.part;
  el('modalPartMeta').textContent = p.rak + ' · sisa ' + sisaStok(p) + ' ' + p.satuan;
  el('inputEmail').value = '';
  el('inputQty').value = 1;
  el('inputNote').value = '';
  el('modalError').style.display = 'none';
  setToggle(type);
  el('modalOverlay').style.display = 'flex';
  setTimeout(()=> el('inputEmail').focus(), 50);
}

function closeModal(){
  el('modalOverlay').style.display = 'none';
  modalPartId = null;
}

function setToggle(type){
  modalType = type;
  el('toggleKeluar').classList.toggle('active', type==='keluar');
  el('toggleMasuk').classList.toggle('active', type==='masuk');
}

async function submitModal(){
  if(isSaving) return;
  const p = state.parts.find(x=>x.id===modalPartId);
  const email = el('inputEmail').value.trim();
  const qty = parseInt(el('inputQty').value, 10);
  const note = el('inputNote').value.trim();
  const errEl = el('modalError');

  if(!email || !email.includes('@')){
    errEl.textContent = 'Masukkan email yang valid.';
    errEl.style.display = 'block';
    return;
  }
  if(!qty || qty < 1){
    errEl.textContent = 'Jumlah harus lebih dari 0.';
    errEl.style.display = 'block';
    return;
  }
  if(modalType==='keluar' && qty > sisaStok(p)){
    errEl.textContent = 'Jumlah melebihi sisa stok (' + sisaStok(p) + ' ' + p.satuan + ').';
    errEl.style.display = 'block';
    return;
  }
  errEl.style.display = 'none';

  isSaving = true;
  el('modalSubmitBtn').textContent = 'Menyimpan...';
  el('modalSubmitBtn').disabled = true;

  try{
    const res = await window.storage.get(STORAGE_KEY, true);
    if(res && res.value) state = JSON.parse(res.value);
  }catch(e){ /* keep local state if fetch fails */ }

  const fresh = state.parts.find(x=>x.id===modalPartId);
  const now = new Date().toISOString();

  if(modalType==='keluar'){
    if(qty > sisaStok(fresh)){
      errEl.textContent = 'Stok sudah berubah, sisa sekarang ' + sisaStok(fresh) + '. Coba lagi.';
      errEl.style.display = 'block';
      isSaving = false;
      el('modalSubmitBtn').textContent = 'Simpan';
      el('modalSubmitBtn').disabled = false;
      renderStockList();
      return;
    }
    fresh.qtyDiambil += qty;
    fresh.tanggalKeluar = now;
    fresh.pic = email;
  } else {
    fresh.qtyAwal += qty;
    fresh.tanggalMasuk = now;
    fresh.pic = email;
  }

  state.transactions.push({
    id: 'tx'+Date.now()+Math.random().toString(36).slice(2,6),
    ts: now,
    partId: fresh.id,
    partName: fresh.part,
    rak: fresh.rak,
    satuan: fresh.satuan,
    type: modalType,
    qty: qty,
    email: email,
    note: note
  });

  try{
    await saveState();
    showToast(modalType==='keluar' ? 'Tercatat: diambil oleh '+email : 'Tercatat: stok ditambah oleh '+email);
    closeModal();
    renderStockList();
    renderHistoryList();
  }catch(e){
    errEl.textContent = 'Gagal menyimpan. Periksa koneksi lalu coba lagi.';
    errEl.style.display = 'block';
  }

  isSaving = false;
  el('modalSubmitBtn').textContent = 'Simpan';
  el('modalSubmitBtn').disabled = false;
}

async function submitAddPart(){
  if(isSaving) return;
  const rak = el('newPartRak').value.trim();
  const partName = el('newPartName').value.trim();
  const qty = parseInt(el('newPartQty').value, 10);
  const satuan = el('newPartSatuan').value.trim();
  const email = el('newPartEmail').value.trim();
  const note = el('newPartNote').value.trim();
  const errEl = el('addPartError');

  if(!rak){ errEl.textContent = 'Rak wajib diisi.'; errEl.style.display='block'; return; }
  if(!partName){ errEl.textContent = 'Nama part wajib diisi.'; errEl.style.display='block'; return; }
  if(isNaN(qty) || qty < 0){ errEl.textContent = 'Qty awal tidak valid.'; errEl.style.display='block'; return; }
  if(!satuan){ errEl.textContent = 'Satuan wajib diisi.'; errEl.style.display='block'; return; }
  if(!email || !email.includes('@')){ errEl.textContent = 'Masukkan email yang valid.'; errEl.style.display='block'; return; }
  errEl.style.display = 'none';

  isSaving = true;
  el('addPartSubmitBtn').textContent = 'Menyimpan...';
  el('addPartSubmitBtn').disabled = true;

  try{
    const res = await window.storage.get(STORAGE_KEY, true);
    if(res && res.value) state = JSON.parse(res.value);
  }catch(e){ /* keep local state if fetch fails */ }

  const dupKey = keyOf(rak, partName);
  if(state.parts.some(p=> keyOf(p.rak, p.part) === dupKey)){
    errEl.textContent = 'Part dengan rak dan nama yang sama sudah ada.';
    errEl.style.display = 'block';
    isSaving = false;
    el('addPartSubmitBtn').textContent = 'Simpan Part';
    el('addPartSubmitBtn').disabled = false;
    return;
  }

  let maxNum = 0;
  state.parts.forEach(p=>{
    const m = /^p(\d+)$/.exec(p.id);
    if(m) maxNum = Math.max(maxNum, parseInt(m[1], 10));
  });
  const now = new Date().toISOString();
  const newPart = {
    id: 'p'+(maxNum+1),
    rak: rak,
    part: partName,
    qtyAwal: qty,
    satuan: satuan,
    qtyDiambil: 0,
    tanggalMasuk: now,
    tanggalKeluar: null,
    pic: email
  };
  state.parts.push(newPart);

  state.transactions.push({
    id: 'tx'+Date.now()+Math.random().toString(36).slice(2,6),
    ts: now,
    partId: newPart.id,
    partName: newPart.part,
    rak: newPart.rak,
    satuan: newPart.satuan,
    type: 'baru',
    qty: qty,
    email: email,
    note: note
  });

  try{
    await saveState();
    showToast('Part baru ditambahkan: '+partName);
    closeAddPartModal();
    renderRakFilters();
    renderStockList();
    renderHistoryList();
  }catch(e){
    errEl.textContent = 'Gagal menyimpan. Periksa koneksi lalu coba lagi.';
    errEl.style.display = 'block';
  }

  isSaving = false;
  el('addPartSubmitBtn').textContent = 'Simpan Part';
  el('addPartSubmitBtn').disabled = false;
}

async function refreshFromStorage(silent){
  try{
    const res = await window.storage.get(STORAGE_KEY, true);
    if(res && res.value) state = JSON.parse(res.value);
    mergeMissingParts(state);
    renderRakFilters();
    if(currentView==='stock') renderStockList(); else renderHistoryList();
    if(!silent) showToast('Data terbaru dimuat.');
  }catch(e){
    if(!silent) showToast('Gagal sinkron. Coba lagi.');
  }
}

function switchView(view){
  currentView = view;
  el('viewStockBtn').classList.toggle('active', view==='stock');
  el('viewHistoryBtn').classList.toggle('active', view==='history');
  el('stockView').style.display = view==='stock' ? 'block' : 'none';
  el('historyView').style.display = view==='history' ? 'block' : 'none';
  if(view==='history') renderHistoryList();
}

async function init(){
  await loadState();
  renderRakFilters();
  renderStockList();

  el('viewStockBtn').addEventListener('click', ()=> switchView('stock'));
  el('viewHistoryBtn').addEventListener('click', ()=> switchView('history'));
  el('refreshBtn').addEventListener('click', ()=> refreshFromStorage(false));
  el('searchInput').addEventListener('input', (e)=>{ searchTerm = e.target.value; renderStockList(); });
  el('toggleKeluar').addEventListener('click', ()=> setToggle('keluar'));
  el('toggleMasuk').addEventListener('click', ()=> setToggle('masuk'));
  el('modalCancelBtn').addEventListener('click', closeModal);
  el('modalSubmitBtn').addEventListener('click', submitModal);
  el('modalOverlay').addEventListener('click', (e)=>{ if(e.target.id==='modalOverlay') closeModal(); });

  el('addPartBtn').addEventListener('click', openAddPartModal);
  el('addPartCancelBtn').addEventListener('click', closeAddPartModal);
  el('addPartSubmitBtn').addEventListener('click', submitAddPart);
  el('addPartModalOverlay').addEventListener('click', (e)=>{ if(e.target.id==='addPartModalOverlay') closeAddPartModal(); });

  setInterval(()=>{
    if(el('modalOverlay').style.display==='none' && el('addPartModalOverlay').style.display==='none'){
      refreshFromStorage(true);
    }
  }, 10000);
}

init();
</script>
